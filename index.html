<!DOCTYPE html>
<html lang="nb" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kjøleskap — Ability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-accent: #D63E42;
      --c-accent-hover: #C23539;
      --c-accent-muted: rgba(214,62,66,0.08);
      --c-accent-text: #FFFFFF;
      --c-bg: #FAF9F7;
      --c-surface-0: #FFFFFF;
      --c-surface-1: #F5F4F1;
      --c-surface-2: #EEEDEA;
      --c-surface-3: #E5E4E0;
      --c-border: rgba(0,0,0,0.07);
      --c-border-strong: rgba(0,0,0,0.12);
      --c-text-1: #1A1917;
      --c-text-2: #5C5A55;
      --c-text-3: #9A9894;
      --c-success: #2E9E5E;
      --c-success-muted: rgba(46,158,94,0.10);
      --c-error: #DC3545;
      --c-error-muted: rgba(220,53,69,0.08);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-pill: 9999px;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
      --dur-fast: 150ms;
      --dur-norm: 250ms;
    }

    [data-theme="dark"] {
      --c-accent: #E8464A;
      --c-accent-hover: #F06265;
      --c-accent-muted: rgba(232,70,74,0.12);
      --c-bg: #0E0E0D;
      --c-surface-0: #141413;
      --c-surface-1: #1A1A19;
      --c-surface-2: #222221;
      --c-surface-3: #2C2C2A;
      --c-border: rgba(255,255,255,0.07);
      --c-border-strong: rgba(255,255,255,0.12);
      --c-text-1: #F2F1EF;
      --c-text-2: #A8A6A1;
      --c-text-3: #6B6964;
      --c-success: #4ADE80;
      --c-success-muted: rgba(74,222,128,0.10);
      --c-error: #F87171;
      --c-error-muted: rgba(248,113,113,0.08);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.35);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--c-bg);
      color: var(--c-text-1);
      min-height: 100vh;
      transition: background var(--dur-norm) var(--ease-out), color var(--dur-norm) var(--ease-out);
    }

    #app { max-width: 480px; margin: 0 auto; padding: 1rem 1rem 4rem; }

    button {
      font-family: 'Outfit', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--c-text-1);
      background: var(--c-surface-0);
      border: 1px solid var(--c-border-strong);
      border-radius: var(--radius-pill);
      cursor: pointer;
      padding: 9px 18px;
      transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: var(--c-surface-1); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    button:active { transform: scale(0.98); box-shadow: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
    button:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

    .btn-accent { background: var(--c-accent); color: var(--c-accent-text); border-color: var(--c-accent); }
    .btn-accent:hover { background: var(--c-accent-hover); border-color: var(--c-accent-hover); }

    .btn-ghost { background: transparent; border-color: transparent; color: var(--c-text-3); box-shadow: none; }
    .btn-ghost:hover { background: var(--c-surface-1); color: var(--c-text-2); box-shadow: none; }

    .btn-person {
      width: 100%;
      justify-content: space-between;
      padding: 18px 20px;
      font-size: 1rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      border-radius: var(--radius-xl);
      background: var(--c-surface-0);
      border: 1px solid var(--c-border);
      box-shadow: var(--shadow-sm);
    }
    .btn-person:hover { border-color: var(--c-border-strong); box-shadow: var(--shadow-md); transform: translateY(-2px); }

    input[type="text"], input[type="password"] {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      color: var(--c-text-1);
      background: var(--c-surface-0);
      border: 1px solid var(--c-border-strong);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      outline: none;
      width: 100%;
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    input:focus { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-muted); }

    select {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      color: var(--c-text-1);
      background: var(--c-surface-0);
      border: 1px solid var(--c-border-strong);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      outline: none;
      width: 100%;
      cursor: pointer;
    }
    select:focus { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-muted); }

    .card {
      background: var(--c-surface-0);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }

    .metric-card { background: var(--c-surface-1); border: 1px solid var(--c-border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
    .metric-label { font-family: 'Outfit', sans-serif; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-text-3); margin-bottom: 6px; }
    .metric-value { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 600; color: var(--c-text-1); }

    .bar-track { flex: 1; background: var(--c-surface-3); border-radius: var(--radius-pill); height: 5px; overflow: hidden; }
    .bar-fill { background: var(--c-accent); height: 100%; border-radius: var(--radius-pill); transition: width 0.4s var(--ease-out); }

    .counter-btn { width: 34px; height: 34px; padding: 0; font-size: 1.375rem; font-weight: 300; border-radius: var(--radius-sm); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; line-height: 1; font-family: 'DM Sans', sans-serif; }

    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 17px; color: var(--c-text-3); pointer-events: none; }
    .search-wrap input { padding-left: 42px; border-radius: var(--radius-pill); }

    .tab-bar { display: flex; gap: 6px; background: var(--c-surface-1); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; padding: 9px 12px; font-size: 0.875rem; font-weight: 600; border-radius: var(--radius-pill); border-color: transparent; background: transparent; box-shadow: none; color: var(--c-text-2); }
    .tab-btn:hover { background: var(--c-surface-2); transform: none; box-shadow: none; }
    .tab-btn.active { background: var(--c-surface-0); color: var(--c-text-1); box-shadow: var(--shadow-sm); border-color: transparent; }

    .sort-btn { font-size: 0.75rem; padding: 5px 12px; border-radius: var(--radius-pill); }
    .sort-btn.active { background: var(--c-accent-muted); color: var(--c-accent); border-color: var(--c-accent); }

    .divider { border: none; border-top: 1px solid var(--c-border); margin: 1.5rem 0; }

    .overline { font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--c-accent); }

    .theme-toggle { width: 44px; height: 24px; border-radius: var(--radius-pill); background: var(--c-surface-3); border: 1px solid var(--c-border-strong); cursor: pointer; position: relative; padding: 0; flex-shrink: 0; transition: background var(--dur-norm) var(--ease-out); box-shadow: none; }
    .theme-toggle:hover { transform: none; box-shadow: none; background: var(--c-surface-3); }
    .theme-toggle-knob { width: 18px; height: 18px; border-radius: 50%; background: var(--c-surface-0); box-shadow: var(--shadow-sm); position: absolute; top: 2px; left: 2px; transition: transform var(--dur-norm) var(--ease-spring); }
    [data-theme="dark"] .theme-toggle { background: var(--c-accent); border-color: var(--c-accent); }
    [data-theme="dark"] .theme-toggle-knob { transform: translateX(20px); }

    /* register panel */
    .register-panel {
      margin-top: 2rem;
      background: var(--c-surface-0);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
    [data-theme="dark"] body::after { opacity: 0.03; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const PRICE = 20;
const ADMIN_PIN = '1007';
const THEME_KEY = 'brus_theme';
const MONTH_NAMES = ['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];

// --- API ---
// Sett til Railway-URL etter deploy, f.eks.: const API_URL = 'https://kjoleskap.up.railway.app';
const API_URL = window.KJOLESKAP_API_URL || 'https://kjoleskap-registrering-production.up.railway.app';

async function apiFetch(path, options = {}) {
  try {
    const res = await fetch(API_URL + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    console.error('API-feil:', path, e);
    throw e;
  }
}

function currentPeriod() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function periodLabel(key) {
  const [y,m] = key.split('-');
  return `${MONTH_NAMES[parseInt(m)-1]} ${y}`;
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  const t = document.querySelector('.theme-toggle');
  if (t) t.innerHTML = `<div class="theme-toggle-knob"></div>`;
}

let state = {
  people: [],
  periods: {},
  activePeriod: currentPeriod(),   // oppdateres av serveren ved oppstart
  view: 'home',
  search: '',
  lastPerson: null,
  pinError: false,
  sortMode: 'default',
  adminTab: 'current',
  selectedPeriod: currentPeriod(),
  showRegister: false,
  registerError: '',
  renamingPerson: null,
  loading: true,
  apiError: false
};

let MULTI_REGISTER = ['KL eller Møte'];

// --- API data functions ---

async function loadState() {
  try {
    state.loading = true;
    render();
    const [people, periods, periodRes] = await Promise.all([
      apiFetch('/api/people'),
      apiFetch('/api/periods'),
      apiFetch('/api/period/current')
    ]);
    state.people = people;
    state.activePeriod = periodRes.period;
    state.selectedPeriod = periodRes.period;
    // Sørg for at aktiv periode er inkludert
    const allPeriods = periods.includes(periodRes.period) ? periods : [periodRes.period, ...periods];
    const counts = await Promise.all(allPeriods.map(p => apiFetch(`/api/counts/${p}`).then(c => [p, c])));
    state.periods = Object.fromEntries(counts);
    state.loading = false;
    state.apiError = false;
  } catch(e) {
    state.loading = false;
    state.apiError = true;
  }
  render();
}

async function savePeople() {
  await apiFetch('/api/people', {
    method: 'POST',
    body: JSON.stringify({ people: state.people })
  });
}

async function saveCount(period, person, delta) {
  const result = await apiFetch(`/api/counts/${period}`, {
    method: 'POST',
    body: JSON.stringify({ person, delta })
  });
  if (!state.periods[period]) state.periods[period] = {};
  state.periods[period][person] = result.count;
  return result.count;
}

async function setCount(period, person, count) {
  await apiFetch(`/api/counts/${period}/${encodeURIComponent(person)}`, {
    method: 'PUT',
    body: JSON.stringify({ count })
  });
  if (!state.periods[period]) state.periods[period] = {};
  state.periods[period][person] = count;
}

function getCountsFor(period) {
  if (!state.periods[period]) state.periods[period] = {};
  return state.periods[period];
}

function allPeriodsSorted() {
  return Object.keys(state.periods).sort((a,b) => b.localeCompare(a));
}

function setView(v) { state.search=''; state.pinError=false; state.showRegister=false; state.registerError=''; state.view=v; render(); }
function goHome() { state.search=''; state.showRegister=false; state.registerError=''; state.view='home'; render(); }

async function takeBrus(person) {
  if (MULTI_REGISTER.includes(person)) {
    state.lastPerson = person;
    state.view = 'quantity';
    state.search = '';
    render();
    return;
  }
  // Vis bekreftelsesside med månedsantall
  state.lastPerson = person;
  state.search = '';
  state.view = 'confirm';
  render();
}

async function confirmBrus() {
  const person = state.lastPerson;
  try {
    await saveCount(state.activePeriod, person, 1);
    state.view = 'thanks';
    render();
  } catch(e) {
    alert('Kunne ikke registrere. Sjekk nettverkstilkobling.');
  }
}

async function confirmQuantity() {
  const inp = document.getElementById('qty-inp');
  const qty = parseInt(inp ? inp.value : 0);
  if (!qty || qty < 1) {
    const err = document.getElementById('qty-err');
    if (err) err.style.display = 'block';
    return;
  }
  try {
    await saveCount(state.activePeriod, state.lastPerson, qty);
    state.lastQty = qty;
    state.view = 'thanks';
    render();
  } catch(e) {
    alert('Kunne ikke registrere. Sjekk nettverkstilkobling.');
  }
}

function tryPin() {
  const val = document.getElementById('pin-inp').value;
  if (val === ADMIN_PIN) {
    state.pinError=false; state.sortMode='default'; state.adminTab='current';
    state.selectedPeriod=state.activePeriod; state.view='admin'; render();
  } else {
    state.pinError=true; render();
    setTimeout(()=>{ const i=document.getElementById('pin-inp'); if(i) i.focus(); },0);
  }
}
function adminLogout() { state.view='home'; render(); }

function setAdminTab(tab) {
  state.adminTab=tab;
  if (tab==='history') {
    const past=allPeriodsSorted().filter(p=>p!==state.activePeriod);
    if (past.length && state.selectedPeriod===state.activePeriod) state.selectedPeriod=past[0];
  } else { state.selectedPeriod=state.activePeriod; }
  renderAdminBody();
}
function onPeriodChange(val) { state.selectedPeriod=val; renderPeriodView(); }

function getSortedPeople(counts) {
  const list=[...state.people];
  if (state.sortMode==='asc') return list.sort((a,b)=>(counts[a]||0)-(counts[b]||0));
  if (state.sortMode==='desc') return list.sort((a,b)=>(counts[b]||0)-(counts[a]||0));
  return list.sort((a,b)=>a.localeCompare(b,'nb'));
}
function setSortMode(mode) {
  state.sortMode=mode;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  renderCurrentList();
}

async function addCount(person, delta) {
  const counts = getCountsFor(state.activePeriod);
  const current = counts[person] || 0;
  if (current + delta < 0) return;
  try {
    await saveCount(state.activePeriod, person, delta);
    renderCurrentList();
  } catch(e) {
    alert('Kunne ikke oppdatere. Sjekk nettverkstilkobling.');
  }
}

async function addPersonAdmin() {
  const inp=document.getElementById('np');
  const name=inp.value.trim();
  if (!name) return;
  if (state.people.some(p=>p.toLowerCase()===name.toLowerCase())) return;
  state.people.push(name);
  inp.value='';
  try {
    await savePeople();
    renderCurrentList();
  } catch(e) {
    state.people.pop();
    alert('Kunne ikke legge til ansatt.');
  }
}

async function removePerson(p) {
  if (!confirm('Fjern '+p+'?')) return;
  state.people=state.people.filter(x=>x!==p);
  try {
    await apiFetch(`/api/people/${encodeURIComponent(p)}`, { method: 'DELETE' });
    renderCurrentList();
  } catch(e) {
    alert('Kunne ikke fjerne ansatt.');
    await loadState();
  }
}

function nameToId(p) { return p.replace(/[^a-zA-Z0-9]/g,'-'); }

function startRename(p) {
  state.renamingPerson = p;
  renderCurrentList();
  setTimeout(() => { const i=document.getElementById('rename-inp-'+nameToId(p)); if(i){i.focus();i.select();} }, 0);
}

async function submitRename(oldName) {
  const inp = document.getElementById('rename-inp-'+nameToId(oldName));
  if (!inp) return;
  const newName = inp.value.trim();
  if (!newName || newName===oldName) { state.renamingPerson=null; renderCurrentList(); return; }
  if (state.people.some(p=>p.toLowerCase()===newName.toLowerCase()&&p!==oldName)) { inp.style.borderColor='var(--c-error)'; return; }

  const idx=state.people.indexOf(oldName);
  if (idx!==-1) state.people[idx]=newName;

  // Oppdater lokalt state
  Object.keys(state.periods).forEach(period=>{
    if (state.periods[period][oldName]!==undefined) {
      state.periods[period][newName]=state.periods[period][oldName];
      delete state.periods[period][oldName];
    }
  });
  const mrIdx=MULTI_REGISTER.indexOf(oldName);
  if (mrIdx!==-1) MULTI_REGISTER[mrIdx]=newName;
  state.renamingPerson=null;

  try {
    await apiFetch('/api/people/rename', {
      method: 'POST',
      body: JSON.stringify({ oldName, newName })
    });
    renderCurrentList();
  } catch(e) {
    alert('Kunne ikke gi nytt navn.');
    await loadState();
  }
}
async function resetCurrentPeriod() {
  if (!confirm('Nullstill alle tellere for '+periodLabel(state.activePeriod)+'?\n\nHistorikken beholdes.')) return;
  try {
    await apiFetch(`/api/counts/${state.activePeriod}`, { method: 'DELETE' });
    state.periods[state.activePeriod]={};
    renderCurrentList();
  } catch(e) {
    alert('Kunne ikke nullstille periode.');
  }
}

// Self-register
function toggleRegister() {
  state.showRegister=!state.showRegister;
  state.registerError='';
  render();
}

async function submitRegister() {
  const inp=document.getElementById('reg-inp');
  if (!inp) return;
  const name=inp.value.trim();
  if (!name) { state.registerError='Skriv inn navnet ditt.'; renderRegisterPanel(); return; }
  if (state.people.some(p=>p.toLowerCase()===name.toLowerCase())) {
    state.registerError='Dette navnet er allerede registrert.'; renderRegisterPanel(); return;
  }
  state.people.push(name);
  try {
    await savePeople();
    state.showRegister=false;
    state.registerError='';
    render();
  } catch(e) {
    state.people.pop();
    state.registerError='Kunne ikke registrere. Prøv igjen.';
    renderRegisterPanel();
  }
}

function renderRegisterPanel() {
  const el=document.getElementById('register-panel');
  if (!el) return;
  el.innerHTML = `
    <p style="font-family:'Outfit',sans-serif;font-size:0.875rem;font-weight:600;color:var(--c-text-2);margin:0 0 10px;">Opprett deg selv</p>
    <div style="display:flex;gap:8px;margin-bottom:${state.registerError?'8px':'0'};">
      <input type="text" id="reg-inp" placeholder="Ditt fulle navn" style="flex:1;border-radius:var(--radius-pill);padding-left:16px;" onkeydown="if(event.key==='Enter')submitRegister()" />
      <button onclick="submitRegister()" class="btn-accent" style="flex-shrink:0;padding:9px 16px;">Legg til</button>
    </div>
    ${state.registerError?`<p style="font-size:0.8125rem;color:var(--c-error);margin-top:6px;">${state.registerError}</p>`:''}
  `;
  setTimeout(()=>{ const i=document.getElementById('reg-inp'); if(i) i.focus(); },0);
}

function esc(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function personRowsEditable(counts) {
  const sorted=getSortedPeople(counts);
  const maxCount=Math.max(...state.people.map(p=>counts[p]||0),1);
  return sorted.map(p=>{
    const c=counts[p]||0, pct=Math.round((c/maxCount)*100);
    const isMulti=MULTI_REGISTER.includes(p);
    const isRenaming=state.renamingPerson===p;
    const escapedId=p.replace(/[^a-zA-Z0-9]/g,'-');
    return `
    <div class="card">

function personRowsReadonly(counts) {
  const sorted=[...state.people].sort((a,b)=>(counts[b]||0)-(counts[a]||0));
  const maxCount=Math.max(...sorted.map(p=>counts[p]||0),1);
  return sorted.map(p=>{
    const c=counts[p]||0, pct=Math.round((c/maxCount)*100);
    return `
    <div class="card" style="opacity:${c===0?'0.4':'1'}">
      <div style="display:flex;align-items:center;gap:8px;${c>0?'margin-bottom:12px;':''}">
        <span style="flex:1;font-size:0.9375rem;font-weight:500;">${p}</span>
        <span style="font-family:'Outfit',sans-serif;font-size:0.9375rem;font-weight:600;">${c}</span>
        <span style="font-size:0.8125rem;color:var(--c-text-2);min-width:54px;text-align:right;">${c*PRICE} kr</span>
      </div>
      ${c>0?`<div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>`:''}
    </div>`;
  }).join('');
}

}

function exportExcel() {
  const counts = getCountsFor(state.selectedPeriod);
  const label = periodLabel(state.selectedPeriod);
  const sorted = [...state.people].sort((a,b)=>(counts[b]||0)-(counts[a]||0));
  const total = sorted.reduce((s,p)=>s+(counts[p]||0),0);

  const XLS = window.XLSXStyle || window.XLSX;
  if (!XLS) { alert('Excel-biblioteket lastes — prøv igjen om ett sekund.'); return; }

  const TITLE_BG = 'E68B8D';
  const HDR_BG   = 'F6D8D9';
  const ZEBRA    = 'F5F4F1';
  const TOTAL_BG = 'E8E7E4';

  function c(v, t, bgRgb, bold, hAlign) {
    return {
      v, t: t||'s',
      s: {
        fill: { patternType:'solid', fgColor:{ rgb: bgRgb||'FFFFFF' } },
        font: { name:'Calibri', sz:12, bold:!!bold, color:{ rgb:'000000' } },
        alignment: { horizontal: hAlign||'left', vertical:'center' }
      }
    };
  }

  const ws = {};
  ws['A1'] = c(`Mineralvann \u2014 ${label}`, 's', TITLE_BG, true, 'center');
  ws['B1'] = c('', 's', TITLE_BG);
  ws['C1'] = c('', 's', TITLE_BG);
  ws['A2'] = c('Navn',       's', HDR_BG, false, 'left');
  ws['B2'] = c('Antall',     's', HDR_BG, false, 'center');
  ws['C2'] = c('Bel\u00f8p (kr)', 's', HDR_BG, false, 'right');

  sorted.forEach((p, i) => {
    const cnt = counts[p]||0;
    const bg = i % 2 === 0 ? 'FFFFFF' : ZEBRA;
    const r = i + 3;
    ws[`A${r}`] = c(p,         's', bg, false, 'left');
    ws[`B${r}`] = c(cnt,       'n', bg, false, 'center');
    ws[`C${r}`] = c(cnt*PRICE, 'n', bg, false, 'right');
  });

  const tr = sorted.length + 3;
  ws[`A${tr}`] = c('Totalt',   's', TOTAL_BG, true, 'left');
  ws[`B${tr}`] = c(total,      'n', TOTAL_BG, true, 'center');
  ws[`C${tr}`] = c(total*PRICE,'n', TOTAL_BG, true, 'right');

  ws['!ref']    = XLS.utils.encode_range({s:{r:0,c:0}, e:{r:tr-1,c:2}});
  ws['!cols']   = [{wch:26},{wch:10},{wch:14}];
  ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:2}}];
  ws['!rows']   = [{hpt:22},{hpt:18}];

  const wb = XLS.utils.book_new();
  XLS.utils.book_append_sheet(wb, ws, label);
  XLS.writeFile(wb, `mineralvann_${state.selectedPeriod}.xlsx`);
}

        <h1 style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:700;margin:0.5rem 0 0.35rem;">${name}</h1>
        <p style="font-size:0.9375rem;color:var(--c-text-2);margin:0 0 2rem;">${isMulti ? qty+' mineralvann lagt til i '+periodLabel(state.activePeriod) : 'Mineralvann lagt til i '+periodLabel(state.activePeriod)}</p>
        ${isMulti ? `
        <div style="background:var(--c-surface-1);border:1px solid var(--c-border);border-radius:var(--radius-xl);padding:1.5rem;display:inline-block;min-width:200px;margin-bottom:2rem;">
          <div class="metric-label" style="margin-bottom:8px;">Registrert nå</div>
          <div style="font-family:'Outfit',sans-serif;font-size:3.5rem;font-weight:700;color:var(--c-text-1);line-height:1;">${qty}</div>
          <div style="font-size:0.875rem;color:var(--c-text-2);margin-top:6px;">mineralvann</div>
        </div>` : `
        <div style="background:var(--c-surface-1);border:1px solid var(--c-border);border-radius:var(--radius-xl);padding:1.5rem;display:inline-block;min-width:200px;margin-bottom:2rem;">
          <div class="metric-label" style="margin-bottom:8px;">Du har tatt totalt denne måneden</div>
          <div style="font-family:'Outfit',sans-serif;font-size:3.5rem;font-weight:700;color:var(--c-text-1);line-height:1;">${count}</div>
          <div style="font-size:0.875rem;color:var(--c-text-2);margin-top:6px;">mineralvann</div>
        </div>`}
        <br />
        <button onclick="goHome()" style="padding:12px 28px;">
          ← Tilbake
        </button>
      </div>`;

  } else if (state.view==='admin') {
    app.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:1.5rem;">
        <button onclick="adminLogout()" class="btn-ghost" style="padding:8px 12px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
        <h2 style="font-family:'Outfit',sans-serif;font-size:1.25rem;font-weight:700;margin:0;flex:1;">Admin</h2>
        ${themeToggleHtml()}
      </div>
      <div class="tab-bar">
        <button class="tab-btn ${state.adminTab==='current'?'active':''}" onclick="setAdminTab('current')">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${periodLabel(state.activePeriod)}
        </button>
        <button class="tab-btn ${state.adminTab==='history'?'active':''}" onclick="setAdminTab('history')">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Historikk
        </button>
      </div>
      <div id="admin-body"></div>`;
    renderAdminBody();
  }
}

document.getElementById('app').addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target && e.target.id==='np') addPersonAdmin();
});

initTheme();
loadState();
</script>
</body>
</html>
